name: Namespace quota envtest

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envtest:
    name: Namespace quota API-server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Kubernetes envtest assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.18
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.30.x -p path)" >> "$GITHUB_ENV"
      - name: Run namespace quota envtest
        run: go test -race -count=1 ./internal/controller -run '^TestNamespaceQuotaEnvtest$'
