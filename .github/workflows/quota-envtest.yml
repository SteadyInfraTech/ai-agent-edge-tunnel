name: Namespace quota envtest

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envtest:
    name: Namespace quota API-server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install Kubernetes envtest assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25
          assets="$(setup-envtest use 1.37.0 --use-deprecated-gcs=false -p path)"
          test -x "$assets/kube-apiserver"
          test -x "$assets/etcd"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Run Kubernetes API-server envtests
        run: go test -race -count=1 ./internal/controller -run Envtest



