apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edge-tunnel-tenant-policy
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups: [edge.steadyinfra.com]
      apiVersions: [v1alpha1]
      operations: [CREATE, UPDATE]
      resources: [agentedgetunnels]
      scope: Namespaced
  matchConditions:
  - name: skip-policy-for-terminating-finalizer-removal
    expression: >-
      request.operation != 'UPDATE' ||
      !has(oldObject.metadata.deletionTimestamp) ||
      oldObject.metadata.deletionTimestamp == null ||
      object.spec != oldObject.spec ||
      object.metadata.name != oldObject.metadata.name ||
      object.metadata.namespace != oldObject.metadata.namespace ||
      object.metadata.uid != oldObject.metadata.uid ||
      object.metadata.labels != oldObject.metadata.labels ||
      object.metadata.annotations != oldObject.metadata.annotations ||
      object.metadata.ownerReferences != oldObject.metadata.ownerReferences ||
      object.status != oldObject.status ||
      !(
        oldObject.metadata.finalizers.exists(f, f == 'edge.steadyinfra.com/tunnel-cleanup') &&
        (!has(object.metadata.finalizers) ||
         !object.metadata.finalizers.exists(f, f == 'edge.steadyinfra.com/tunnel-cleanup')) &&
        oldObject.metadata.finalizers.size() ==
          (has(object.metadata.finalizers) ? object.metadata.finalizers.size() : 0) + 1 &&
        (!has(object.metadata.finalizers) ||
         object.metadata.finalizers.all(f, oldObject.metadata.finalizers.exists(oldF, oldF == f)))
      )
  validations:
  - expression: >-
      params.data['CLOUDFLARE_ZONE_ID'] != '' &&
      object.spec.cloudflare.zoneID == params.data['CLOUDFLARE_ZONE_ID'] &&
      params.data['EDGE_BASE_DOMAIN'] != '' &&
      params.data['CLOUDFLARE_ZONE_NAME'] != '' &&
      ((params.data['EDGE_BASE_DOMAIN'].startsWith('.') ?
        params.data['EDGE_BASE_DOMAIN'].substring(1) : params.data['EDGE_BASE_DOMAIN']) ==
       (params.data['CLOUDFLARE_ZONE_NAME'].startsWith('.') ?
        params.data['CLOUDFLARE_ZONE_NAME'].substring(1) : params.data['CLOUDFLARE_ZONE_NAME']) ||
       (params.data['EDGE_BASE_DOMAIN'].startsWith('.') ?
        params.data['EDGE_BASE_DOMAIN'].substring(1) : params.data['EDGE_BASE_DOMAIN']).endsWith('.' +
        (params.data['CLOUDFLARE_ZONE_NAME'].startsWith('.') ?
         params.data['CLOUDFLARE_ZONE_NAME'].substring(1) : params.data['CLOUDFLARE_ZONE_NAME'])))
    message: spec.cloudflare.zoneID must match the configured Cloudflare zone for EDGE_BASE_DOMAIN
  - expression: >-
      !has(object.spec.security) ||
      !has(object.spec.security.allowPublic) ||
      !object.spec.security.allowPublic ||
      params.data['EDGE_PUBLIC_NAMESPACES'].split(',').exists(ns, ns.trim() == request.namespace)
    message: security.allowPublic is permitted only in namespaces listed in EDGE_PUBLIC_NAMESPACES
