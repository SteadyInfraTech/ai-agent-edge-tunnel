apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edge-tunnel-quota-status-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [edge.steadyinfra.com]
      apiVersions: [v1alpha1]
      operations: [UPDATE]
      resources: [namespacetunnelquotas/status]
      scope: Namespaced
  validations:
  - expression: >-
      request.userInfo.username == 'system:serviceaccount:edge-tunnel-system:edge-tunnel-controller-manager' ||
      request.userInfo.groups.exists(group, group == 'system:masters')
    message: NamespaceTunnelQuota status is reserved for the edge-tunnel controller and system:masters
