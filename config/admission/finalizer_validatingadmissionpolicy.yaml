apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edge-tunnel-finalizer-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [edge.steadyinfra.com]
      apiVersions: [v1alpha1]
      operations: [UPDATE]
      resources: [agentedgetunnels]
      scope: Namespaced
  validations:
  - expression: >-
      (has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
       (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)) ||
      request.userInfo.username == 'system:serviceaccount:edge-tunnel-system:edge-tunnel-controller-manager'
    message: only the edge-tunnel controller may change AgentEdgeTunnel finalizers
