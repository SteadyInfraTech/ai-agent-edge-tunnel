apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: edge-tunnel-tenant-policy
spec:
  policyName: edge-tunnel-tenant-policy
  validationActions:
  - Deny
  paramRef:
    name: edge-tunnel-config
    namespace: edge-tunnel-system
    # Missing parameters still deny normal creates and updates because each validation checks params != null.
    # Allow only the narrowly-scoped controller finalizer removal exception during deletion.
    parameterNotFoundAction: Allow
