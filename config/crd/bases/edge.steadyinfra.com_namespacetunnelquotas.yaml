apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: namespacetunnelquotas.edge.steadyinfra.com
spec:
  group: edge.steadyinfra.com
  names:
    kind: NamespaceTunnelQuota
    listKind: NamespaceTunnelQuotaList
    plural: namespacetunnelquotas
    singular: namespacetunnelquota
    shortNames: [ntq]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Limit
      type: integer
      jsonPath: .spec.limit
    - name: Reserved
      type: integer
      jsonPath: .status.reservations
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [limit]
            properties:
              limit:
                type: integer
                format: int32
                minimum: 0
          status:
            type: object
            properties:
              reservations:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [uid]
                items:
                  type: object
                  required: [name, uid]
                  properties:
                    name:
                      type: string
                    uid:
                      type: string
