apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentedgetunnels.agentops.io
spec:
  group: agentops.io
  names:
    kind: AgentEdgeTunnel
    listKind: AgentEdgeTunnelList
    plural: agentedgetunnels
    singular: agentedgetunnel
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              targetPodSelector:
                type: object
                additionalProperties:
                  type: string
              cloudflare:
                type: object
                properties:
                  zoneID:
                    type: string
                  subdomain:
                    type: string
                required:
                - zoneID
                - subdomain
              ttl:
                type: string
              cleanupOnFinish:
                type: boolean
          status:
            type: object
            properties:
              tunnelID:
                type: string
              hostname:
                type: string
              phase:
                type: string
