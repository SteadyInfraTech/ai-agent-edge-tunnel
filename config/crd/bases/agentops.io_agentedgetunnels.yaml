apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentedgetunnels.agentops.io
spec:
  group: agentops.io
  names:
    kind: AgentEdgeTunnel
    listKind: AgentEdgeTunnelList
    plural: agentedgetunnels
    singular: agentedgetunnel
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    # Without the status subresource, the operator's status updates fail.
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Hostname
      type: string
      jsonPath: .status.hostname
    - name: Expires
      type: date
      jsonPath: .status.expiresAt
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - targetPodSelector
            - cloudflare
            properties:
              targetPodSelector:
                type: object
                additionalProperties:
                  type: string
              cloudflare:
                type: object
                required:
                - zoneID
                - subdomain
                properties:
                  zoneID:
                    type: string
                    minLength: 1
                  subdomain:
                    type: string
                    # A single DNS label.
                    pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: cloudflare settings are immutable once set
              ttl:
                type: string
                description: Go duration such as "2h". The clock starts when the tunnel becomes Active.
                # Positive Go durations: leading fractions (.5h), a leading +, and
                # both micro signs. Zero passes the pattern; the controller rejects it.
                pattern: '^\+?(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+$'
              cleanupOnFinish:
                type: boolean
                description: Reserved; accepted but not acted on yet.
              security:
                type: object
                properties:
                  allowedEmails:
                    type: array
                    items:
                      type: string
                  serviceTokens:
                    type: boolean
                  webhookValidation:
                    type: object
                    properties:
                      provider:
                        type: string
                      secretRef:
                        type: string
          status:
            type: object
            properties:
              tunnelID:
                type: string
              hostname:
                type: string
              phase:
                type: string
                enum: [Pending, Active, Terminated, Failed]
              message:
                type: string
              expiresAt:
                type: string
                format: date-time
