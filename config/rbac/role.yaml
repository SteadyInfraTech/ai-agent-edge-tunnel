apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-tunnel-manager-role
rules:
- apiGroups: [edge.steadyinfra.com]
  resources: [agentedgetunnels]
  verbs: [get, list, watch, update, patch]
- apiGroups: [edge.steadyinfra.com]
  resources: [agentedgetunnels/status]
  verbs: [get, update, patch]
- apiGroups: [edge.steadyinfra.com]
  resources: [agentedgetunnels/finalizers]
  verbs: [update]
- apiGroups: [edge.steadyinfra.com]
  resources: [namespacetunnelquotas]
  verbs: [get, list, watch]
- apiGroups: [edge.steadyinfra.com]
  resources: [namespacetunnelquotas/status]
  verbs: [get, update, patch]
- apiGroups: [agents.steadyinfra.com]
  resources: [agentsessions]
  verbs: [get]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, create, update, patch, delete]
# Secrets hold tunnel credentials. The operator reads them directly (its cache
# is disabled for Secrets), so it needs neither list nor watch, and therefore
# cannot enumerate Secrets in the cluster.
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create, update, delete]
