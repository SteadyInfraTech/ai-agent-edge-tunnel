apiVersion: edge.steadyinfra.com/v1alpha1
kind: AgentEdgeTunnel
metadata:
  name: sample-agent-tunnel
  namespace: default
spec:
  # In-namespace Service to expose. The operator runs a cloudflared connector for it.
  service:
    name: langgraph-worker
    port: 8080
  cloudflare:
    zoneID: "REPLACE_WITH_YOUR_ZONE_ID"
    subdomain: "agent-job-8f92"
  ttl: "2h"
  security:
    # Only these identities can reach the hostname (Cloudflare Access).
    allowedEmails:
      - "devops@company.com"
    # To expose a hostname with no authentication (e.g. a webhook receiver),
    # set `allowPublic: true` instead of allowedEmails. It is never the default.
